name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.ref == 'refs/heads/main' && '["3.10", "3.11", "3.12"]' || '["3.12"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run canonical PETRA tests
        run: pytest -q -m "not slow and not legacy" --durations=30 --durations-min=1.0

      - name: Run legacy PET tests (informational, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pytest -q -m "legacy and not slow" --durations=10 --durations-min=5.0
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Check docs consistency
        run: make docs-check

      - name: Run report contract tests
        run: pytest -q tests/test_report_contracts.py
