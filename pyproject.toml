[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petra"
version = "1.0.0"
description = "PETRA — Prime Exponent Tower Recursive Algebra: canonical recursive shape-first algebra"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/gcomneno/petra"
Issues = "https://github.com/gcomneno/petra/issues"

[project.scripts]
petra = "petra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["petra"]

[tool.pytest]
pythonpath = ["src"]

markers = [
    "slow: slow research/integration tests excluded from default CI",
    "legacy: PET-era tests retained during Phase 10; not part of the maintained PETRA surface",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "sympy>=1.12,<2",
]
dev = [
    "petra[test]",
    "ruff>=0.6",
    "mypy>=1.10",
]
