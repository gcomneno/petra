[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petra"
version = "1.0.3"
description = "PETRA — Prime Exponent Tower Recursive Algebra: canonical recursive shape-first algebra"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/gcomneno/petra"
Issues = "https://github.com/gcomneno/petra/issues"

[project.scripts]
petra = "petra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["petra"]

[tool.pytest]
pythonpath = ["src"]

markers = [
    "slow: slow research/integration tests excluded from default CI",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "sympy>=1.12,<2",
]
dev = [
    "petra[test]",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function call in default arg (unused here)
    "RUF001",  # ambiguous unicode: × is the PETRA container separator
    "RUF002",  # ambiguous unicode in docstring: same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False is legitimate in tests

[tool.mypy]
python_version = "3.10"
files = ["src/petra"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
